<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1810">
<title>頭沐 行銷助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#EDE8DF; --surface:#FEFCF8; --sunk:#F5F0E8; --ink:#1E1810; --muted:#7A6E60; --line:#DDD8D0;
  --accent:#B87055; --accent-ink:#FFFFFF; --good:#3A7A4A; --bad:#AA3A20; --warn:#8A6A10; --warn-bg:#F5E8C0;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --f-doc:"Noto Serif TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17120C; --surface:#221B14; --sunk:#2C241B; --ink:#F2EDE4; --muted:#A89C8C; --line:#3A3028;
  --accent:#D08A6E; --accent-ink:#1E1810; --good:#7AB59A; --bad:#E8907A; --warn:#E0BE6A; --warn-bg:#3A3018; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 64px}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:22px;font-family:var(--f-doc);font-weight:600;letter-spacing:.06em}h2{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand small{display:block;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tabs{margin-top:14px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{margin-top:18px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel>h2{margin-bottom:10px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label b{color:var(--ink);font-weight:500;font-size:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.6;min-height:88px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:9px;cursor:pointer;font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 12px;font-size:13px;font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13.5px;padding:8px 12px;border-radius:8px}
.msg.err{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.hint{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.7;color:var(--muted)}
.chip.off{opacity:.55}.chip.todo{color:var(--warn)}
.todo-box{background:var(--warn-bg);border-radius:12px;padding:14px 16px}
.todo-box h2{font-size:15px;color:var(--warn);margin-bottom:6px}
.todo-box ul{margin:0;padding-left:20px;font-size:14px}
.rows{display:grid;gap:8px}
details.item{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.item>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .id{font-size:12px;color:var(--muted);min-width:2.6em}
details.item>summary .main{font-weight:500;flex:1;min-width:8em;overflow-wrap:anywhere}
details.item>summary .main.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400}
details.item[open]>summary{border-bottom:1px solid var(--line)}
details.item>form{padding:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:140px}
.hit{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:6px;font-size:14px}
.hit b{color:var(--warn)}
.soon{color:var(--muted);text-align:center;padding:28px 8px}
.soon h2{color:var(--ink);margin-bottom:8px}
.login{max-width:420px;margin:12vh auto 0;text-align:center;display:grid;gap:16px;justify-items:center}
.login .panel{width:100%;display:grid;gap:14px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cardbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:grid;gap:2px}
.cardbtn b{font-size:15px}.cardbtn small{color:var(--muted);font-size:12px}.cardbtn:disabled{opacity:.55}
.meter{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.article{font-family:var(--f-doc);line-height:1.85;overflow-wrap:anywhere}
.article h1,.article h2,.article h3,.article h4{font-family:var(--f-doc);margin:1.2em 0 .5em}
.article h2{font-size:19px}.article h3{font-size:16px}
.article p,.article ul,.article ol{margin:.6em 0}
.article table{border-collapse:collapse;width:100%;font-family:var(--f-body);font-size:14px;display:block;overflow-x:auto}
.article th,.article td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
mark{background:var(--warn-bg);color:inherit;border-bottom:2px solid var(--warn);padding:0 1px}
.kv{display:grid;gap:12px;overflow-wrap:anywhere}.kv>div{min-width:0}.kv>div>b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
pre.code{background:var(--sunk);border-radius:8px;padding:10px;font-size:12px;overflow-x:auto;white-space:pre;max-height:240px;margin:0}
.listrow{display:flex;gap:8px;align-items:baseline;padding:10px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.pool{display:grid;gap:6px;margin-top:4px}
.pool label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.pool input{width:auto;margin-top:5px;flex:none}.pool small{display:block;color:var(--muted);font-size:12px}
.pics{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-top:6px}
.pic{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);cursor:pointer;display:block;padding:0;color:var(--ink)}
.pic img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.pic .ph{aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.pic small{display:block;font-size:11.5px;padding:3px 5px;line-height:1.35;text-align:left;background:var(--surface)}
.pic input{position:absolute;top:6px;left:6px;width:20px;height:20px;margin:0}
.pic.on{border-color:var(--accent)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.qcard .qtop{display:flex;gap:8px;align-items:center}
.qcard textarea.q{font-weight:500;background:transparent;border-color:transparent;padding:4px 6px;font-size:15.5px;min-height:0;resize:none}
.qcard textarea.q:focus{border-color:var(--line);background:var(--bg)}
.listrow span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.st-待審{color:var(--warn)}.st-失敗{color:var(--bad)}.st-產出中{color:var(--accent)}.st-已核可,.st-已發布{color:var(--good)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>頭沐 行銷助手</h1><small>CHIEFROM ・ 隨點隨產，審稿後手動發布</small></div>
    <div class="who" id="who" hidden><span id="who-name"></span><button class="btn ghost small" id="logout" type="button">登出</button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  <div class="msg err" id="oldbe" hidden style="margin-top:12px">後台還是舊版，有些功能會按了沒反應。請到 Apps Script「部署 → 管理部署作業 → ✏️ 編輯 → 版本選「新版本」→ 部署」，再重新整理這頁。</div>
  <main id="view"><div class="loading">載入中…</div></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ── 設定：部署步驟見 marketing/apps-script/README.md。網址公開沒關係：後台每個動作都會檢查登入 token 與角色。 ── */
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyESejCltZQiOIF8WnbTj8r0iENSYoXh0ljBelvP8HD00_3QeWaTcoqYKKrC7hI4U1kCA/exec";
// Google 登入 ID：和每日回報系統共用（不是密碼，公開沒關係）
const GOOGLE_CLIENT_ID="666667317547-qt7hdpi8du19tq2fb2genfvhkcs7hu5j.apps.googleusercontent.com";
const ADMIN_ID="__admin__";
const MIN_BACKEND=11; // 後台 Code.gs 的 BACKEND_VERSION 至少要這麼新

/* ── 工具 ── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

/* ── 後台呼叫：一律 POST，text/plain 傳 JSON（避開 CORS 預檢），帶 session token ── */
const SKEY='chiefrom.marketing.session';
let session=(()=>{try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}})();
function saveSession(s){session=s;try{s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY)}catch(e){}}
async function api(action,params={}){
  if(!SCRIPT_URL)return{ok:false,error:'NO_BACKEND',message:'尚未設定後台網址'};
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...params,action,token:session?.token||''})});
    const j=await r.json();
    if(j.error==='UNAUTHORIZED'){saveSession(null);UI.config=null;renderLogin('登入已過期，請重新登入');}
    return j;
  }catch(e){return{ok:false,error:'NETWORK',message:'連線失敗，請檢查網路後再試'}}
}
const OLD_BACKEND='後台還是舊版：請到 Apps Script「部署 → 管理部署作業 → ✏️ 編輯 → 版本選「新版本」→ 部署」';
const errText=r=>r.message||({UNKNOWN_ACTION:OLD_BACKEND,FORBIDDEN:'沒有權限',NOT_FOUND:'找不到資料，請重新整理',SERVER_ERROR:'後台發生錯誤'}[r.error])||r.error||'發生錯誤';

/* ── 狀態 ── */
const UI={tab:null,sec:'todo',config:null,q:'',openId:null,adding:false,check:null};
const isAdmin=()=>session?.user?.role==='admin';
const TABS={
  admin:[['make','產出'],['review','審稿'],['settings','設定']],
  staff:[],
};

/* ── 登入：Google 帳號，後台驗證後才發 token ── */
function renderLogin(msg){
  $('#who').hidden=true;$('#tabs').hidden=true;$('#oldbe').hidden=true;
  $('#view').innerHTML=`<div class="login"><div class="panel"><h2>用 Google 帳號登入</h2>
    <p class="hint">Tori 和同仁用自己的 Gmail 登入。</p><div id="gbtn"></div>
    ${msg?`<div class="msg err">${esc(msg)}</div>`:''}
    ${!SCRIPT_URL?'<div class="msg err">系統尚未設定完成（後台網址）。</div>':''}</div></div>`;
  const init=()=>{
    if(!$('#gbtn'))return;
    if(!window.google?.accounts?.id){setTimeout(init,200);return}
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogle,ux_mode:'popup'});
    google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',text:'signin_with',locale:'zh-TW'});
  };
  init();
}
async function onGoogle(resp){
  $('#gbtn').innerHTML='<span class="hint">驗證中…</span>';
  const r=await api('login',{idToken:resp.credential});
  if(!r.ok){renderLogin(r.error==='UNKNOWN_ACTION'||r.error==='LOGIN_FAILED'&&!r.message?OLD_BACKEND:errText(r));return}
  saveSession({token:r.token,user:r.user});UI.tab=null;start();
}
$('#logout').onclick=async()=>{await api('logout');saveSession(null);UI.config=null;try{google.accounts.id.disableAutoSelect()}catch(e){}renderLogin()};

async function start(){
  if(!session){renderLogin();return}
  const me=await api('me');
  if(!me.ok){if(me.error!=='UNAUTHORIZED')renderLogin(errText(me));return}
  session.user=me.user;saveSession(session);
  const tabs=TABS[me.user.role]||[];
  if(!tabs.length){ // 同仁目前沒有要用的功能（照片在每日回報系統上傳）
    $('#who').hidden=false;$('#tabs').hidden=true;$('#who-name').textContent=me.user.name+'・'+me.user.store;
    $('#view').innerHTML='<section class="panel soon"><h2>行銷助手</h2><p>目前沒有需要同仁操作的功能。</p><p class="hint">服務前後照請在每日回報系統的「回流訊息」上傳。</p></section>';return;
  }
  if(!tabs.some(t=>t[0]===UI.tab))UI.tab=tabs[0][0];
  $('#who').hidden=false;
  $('#oldbe').hidden=!(me.user.role==='admin'&&(me.backendVersion||0)<MIN_BACKEND);
  $('#who-name').textContent=me.user.name+(me.user.role==='admin'?'（管理者）':'・'+me.user.store);
  render();
}

/* ── 畫面 ── */
function render(){
  clearInterval(MK.timer);
  const tabs=TABS[session.user.role]||[];
  const nav=$('#tabs');nav.hidden=tabs.length<2;
  nav.innerHTML=tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${UI.tab===k}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;render()});
  if(UI.tab==='settings')return renderSettings();
  if(UI.tab==='make')return renderMake();
  if(UI.tab==='review')return renderReview();
  const soon={
  }[UI.tab];
  $('#view').innerHTML=`<section class="panel soon"><h2>${soon[0]}</h2><p>${esc(soon[1])}</p>${soon[2]?`<p class="hint">${esc(soon[2])}</p>`:''}</section>`;
}

/* ── 產出頁 ── */
const MK={opts:null,list:null,view:null,tab:null,item:null,kw:null,timer:null,started:0,editing:false,people:null};
const today=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
async function renderMake(){
  clearInterval(MK.timer);
  if(MK.view&&MK.tab==='make')return renderItem();
  MK.view=null;
  $('#view').innerHTML='<div class="loading">載入中…</div>';
  const [o,l]=await Promise.all([api('articleOptions'),api('listContent',{type:'官網文章'})]);
  if(!o.ok||!l.ok){$('#view').innerHTML=`<div class="msg err">${esc(errText(o.ok?l:o))}</div>`;return}
  MK.opts=o;MK.list=l.items;
  if(!o.keywords.some(k=>k.id===MK.kw))MK.kw=o.keywords[0]?.id||'';
  const kw=o.keywords.find(k=>k.id===MK.kw);
  const label=k=>`${k.id} ${k.main}（${[k.stage,k.priority+' 級',k.seasonal?'當季':'',k.lastUsed?'上次 '+k.lastUsed:'沒用過'].filter(Boolean).join('・')}）`;
  const over=o.budget>0&&o.spent>=o.budget;
  $('#view').innerHTML=`
  <section class="panel"><h2>官網文章</h2>
    <div class="meter"><span>本月 AI 花費約 NT$${o.spent}${o.budget?' / 上限 NT$'+o.budget:''}</span><span>模型 ${esc(o.model)}</span></div>
    ${!o.hasKey?'<div class="msg err" style="margin-top:10px">還沒設定 Claude API 金鑰（Apps Script → 專案設定 → 指令碼屬性 → ANTHROPIC_API_KEY）。</div>':''}
    ${over?'<div class="msg err" style="margin-top:10px">本月花費已達上限，要繼續請到「設定 → AI 與費用」調高。</div>':''}
    <form id="afrm" style="margin-top:12px">
      <label><b>關鍵字</b><span class="hint">系統依當月、優先序、最久沒用排序，第一個是建議。</span>
        <select name="kw">${o.keywords.map((k,i)=>`<option value="${esc(k.id)}"${k.id===MK.kw?' selected':''}>${i===0?'★ ':''}${esc(label(k))}</option>`).join('')}</select></label>
      <label><b>長尾詞</b><input name="longtail" value="${esc(kw?.longtail||'')}"></label>
      ${o.pool.length?`<div><b style="font-size:14px;font-weight:500">之前留下的素材（勾選就會帶入）</b><div class="pool">${o.pool.map(m=>`<label><input type="checkbox" name="mat" value="${esc(m.id)}"><span>${esc(m.body)}<small>${esc(m.date)}</small></span></label>`).join('')}</div></div>`:''}
      <label><b>這次想寫進去的現場觀察（選填）</b><span class="hint">客人說過的話、店裡發生的事、你的看法。可以一次寫好幾件：一篇只寫一個重點，其他的會存起來下次用。沒寫的地方 AI 會標「待素材」，不會編造。</span>
        <textarea name="notes" rows="5" placeholder="例如：上週有位第一次染白髮的客人說…"></textarea></label>
      <div class="row-actions"><button class="btn" type="submit" ${!o.hasKey||over||!o.keywords.length?'disabled':''}>產出官網文章</button><span class="hint">大約 1～3 分鐘</span></div>
    </form></section>
  <section class="panel"><h2>Google 商家貼文</h2><p class="hint" style="margin:0 0 10px">三間店各一篇，每篇挑不同重點，建議週二發布。</p>
    <form id="gfrm">
      <label><b>根據哪篇內容</b><select name="src">${o.articles.map(a=>`<option value="a:${esc(a.id)}">${esc(a.title)}</option>`).join('')}<option value="k">不用文章，只選關鍵字</option></select></label>
      <label id="gkw" hidden><b>關鍵字</b><select name="kw">${o.keywords.map((k,i)=>`<option value="${esc(k.id)}">${i===0?'★ ':''}${esc(k.id+' '+k.main)}</option>`).join('')}</select></label>
      <label><b>這次想補充的（選填）</b><input name="notes" placeholder="例如：這週想推補染、日和三館剛開幕"></label>
      <div class="row-actions"><button class="btn" type="submit" ${!o.hasKey||over?'disabled':''}>產出 3 篇（三間店各一）</button><span class="hint">大約 1～3 分鐘</span></div>
    </form></section>

/* ── 對比圖（每日回報系統的 PO 文素材） ── */
const THUMBS={};
async function thumbInto(el,id){
  if(!el)return;
  if(!THUMBS[id]){const r=await api('getMaterial',{id});if(!r.ok){el.innerHTML='<span class="ph">讀不到</span>';return}THUMBS[id]=`data:${r.mime};base64,${r.data}`}
  el.innerHTML=`<img alt="對比圖縮圖" src="${THUMBS[id]}">`;
}
async function saveMaterial(id){
  const r=await api('getMaterial',{id,full:true});if(!r.ok){toast(errText(r));return}
  const bytes=Uint8Array.from(atob(r.data),c=>c.charCodeAt(0));const file=new File([bytes],r.name,{type:r.mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=r.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
/* ── 脆：待回答的題目 ── */
async function loadThreads(blocked){
  const box=$('#thq');if(!box)return;
  const r=await api('threadsPending');
  if(!$('#thq'))return;
  if(!r.ok){box.innerHTML=`<div class="msg err">${esc(errText(r))}</div>`;return}
  if(!r.questions.length){box.innerHTML='<p class="hint">目前沒有待回答的題目，按下面的「出 3 題」。</p>';return}
  box.innerHTML=`<form id="thans" style="gap:10px">${r.questions.map(q=>`<div class="qcard" data-q="${esc(q.id)}">
      <div class="qtop"><span class="chip">${esc(q.ring)}</span><span class="hint">${esc((q.createdAt||'').slice(5,10).replace('-','/'))}</span><button class="btn ghost small" type="button" data-skip="${esc(q.id)}" style="margin-left:auto">拿掉這題</button></div>
      <textarea class="q" name="q" rows="2" aria-label="題目（可以改）">${esc(q.question)}</textarea>
      ${q.hint?`<span class="hint">${esc(q.hint)}</span>`:''}
      <textarea name="a" rows="4" placeholder="打字回答，隨便講就好">${esc(q.answer)}</textarea></div>`).join('')}
    <div class="row-actions"><button class="btn" type="submit" ${blocked?'disabled':''}>用我的回答寫初稿</button><span class="hint">一次最多寫 3 則，沒回答的會留著</span></div></form>`;
  const f=$('#thans');
  f.querySelectorAll('.qcard').forEach(c=>{
    const id=c.dataset.q;
    c.querySelector('[name=a]').onchange=e=>api('updateQuestion',{id,answer:e.target.value});
    c.querySelector('[name=q]').onchange=e=>{if(e.target.value.trim())api('updateQuestion',{id,question:e.target.value})};
  });
  f.querySelectorAll('[data-skip]').forEach(b=>b.onclick=async()=>{const r2=await api('updateQuestion',{id:b.dataset.skip,skip:true});if(!r2.ok){toast(errText(r2));return}b.closest('.qcard').remove();if(!f.querySelector('.qcard'))loadThreads(blocked)});
  f.onsubmit=async e=>{e.preventDefault();
    const answers=[...f.querySelectorAll('.qcard')].map(c=>({id:c.dataset.q,question:c.querySelector('[name=q]').value,answer:c.querySelector('[name=a]').value.trim()}));
    if(!answers.some(a=>a.answer)){toast('請至少回答一題');return}
    const b=f.querySelector('[type=submit]');b.disabled=true;
    const r2=await api('startThreads',{answers});if(!r2.ok){b.disabled=false;toast(errText(r2));return}
    openItem(r2.id,true);
  };
}

async function openItem(id,run){
  MK.view=id;MK.tab=UI.tab;MK.item=null;MK.editing=false;MK.started=Date.now();
  if(!MK.people)api('people').then(r=>{if(r.ok)MK.people=r.data});
  if(run)MK.kw=null; // 產出後回到系統建議的下一個關鍵字
  if(run)api('runJob',{id}).then(r=>{if(r.ok&&r.item&&MK.view===id&&UI.tab===MK.tab){MK.item=r.item;renderItem()}});
  const r=await api('getContent',{id});
  if(!r.ok){toast(errText(r));MK.view=null;return renderMake()}
  MK.item=r.item;renderItem();
}

/* 極簡 Markdown：標題、粗體、斜體、連結、清單、表格、段落 */
function md(src){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines=String(src||'').replace(/\r/g,'').split('\n');const out=[];let i=0;
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){i++;continue}
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){const n=Math.min(h[1].length+1,4);out.push(`<h${n}>${inl(h[2])}</h${n}>`);i++;continue}
    if(/^\s*\|/.test(l)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(lines[i++]);
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const body=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r));
      out.push('<table>'+body.map((r,j)=>'<tr>'+cells(r).map(c=>j===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>');continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l);const items=[];
      while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i]))items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
      out.push(`<${ol?'ol':'ul'}>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</${ol?'ol':'ul'}>`);continue}
    const para=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i]))para.push(lines[i++]);
    out.push(`<p>${para.map(inl).join('<br>')}</p>`);
  }
  return out.join('');
}

/** 把有疑慮的詞句標黃（只動文字，不動標籤） */
function markText(root,needles){
  needles=[...new Set(needles.map(n=>String(n||'').replace(/\*\*/g,'').trim()).filter(n=>n.length>=2))].sort((a,b)=>b.length-a.length);
  if(!root||!needles.length)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let t=n.nodeValue,hit=null;
    for(const nd of needles){const i=t.indexOf(nd);if(i>=0&&(!hit||i<hit.i))hit={i,nd}}
    if(!hit)return;
    const frag=document.createDocumentFragment();
    while(hit){
      frag.append(t.slice(0,hit.i));const m=document.createElement('mark');m.textContent=hit.nd;frag.append(m);
      t=t.slice(hit.i+hit.nd.length);hit=null;
      for(const nd of needles){const i=t.indexOf(nd);if(i>=0&&(!hit||i<hit.i))hit={i,nd}}
    }
    frag.append(t);n.replaceWith(frag);
  });
}

async function copyText(t){
  try{await navigator.clipboard.writeText(t||'');toast('已複製')}
  catch(e){const a=document.createElement('textarea');a.value=t||'';document.body.append(a);a.select();document.execCommand('copy');a.remove();toast('已複製')}
}
async function copyRich(html,plain){
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);toast('已複製，貼到官網編輯器會保留標題和粗體')}
  catch(e){copyText(plain)}
}

function rowForm(k,r){
  const tb=UI.config.tables[k];
  const stores=UI.config.tables.stores.rows.map(s=>s.name);
  const field=c=>{
    const v=r?r[c.key]:(c.type==='bool'?'是':c.type==='date'&&k==='examples'?new Date(Date.now()+8*3600e3).toISOString().slice(0,10):'');
    const name=`name="${c.key}"`;
    let input;
    if(c.type==='long')input=`<textarea ${name} rows="${longMain(k)?10:3}">${esc(v)}</textarea>`;
    else if(c.type==='bool')input=`<select ${name}><option value="是"${v==='是'?' selected':''}>是</option><option value="否"${v!=='是'?' selected':''}>否</option></select>`;
    else if(c.type==='select'||c.type==='store'){const opts=c.type==='store'?stores:c.options;
      input=`<select ${name}><option value="">請選擇</option>${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`}
    else if(c.type==='date')input=`<input type="date" ${name} value="${esc(v)}">`;
    else input=`<input ${name} value="${esc(v)}" ${c.type==='num'?'inputmode="numeric"':''} ${c.key==='email'?'type="email" autocomplete="off"':''} ${c.key==='bookingUrl'?'type="url" placeholder="https://"':''}>`;
    return `<label${c.type==='long'||c.key==='note'?' style="grid-column:1/-1"':''}>${esc(c.label)}${input}</label>`;
  };
  const isAdminRow=k==='staff'&&r?.id===ADMIN_ID;
  const cols=tb.cols.filter(c=>c.type!=='id'&&!(isAdminRow&&(c.key==='store'||c.key==='active'||c.key==='email')));
  return `<form class="rowform" data-id="${r?esc(r.id):''}"><div class="fields">${cols.map(field).join('')}</div>
    <div class="row-actions"><button class="btn small" type="submit">${r?'儲存':'新增'}</button>
    <button class="btn ghost small" type="button" data-cancel>取消</button>
    ${r&&!isAdminRow?'<button class="btn danger small" type="button" data-del style="margin-left:auto">刪除</button>':''}</div></form>`;
}

function checkView(){
  const c=UI.check;
  return `<section class="panel"><h2>禁用詞試檢查</h2><p class="hint" style="margin:0 0 10px">貼一段文字，用目前的禁用詞清單比對。第 2 步之後，每次產出都會自動做這個檢查。</p>
    <form id="cform"><textarea name="text" rows="6" placeholder="貼上要檢查的文字">${esc(c?.text||'')}</textarea>
    <div class="row-actions"><button class="btn small" type="submit">檢查</button></div></form>
    ${c?`<div class="rows" style="margin-top:12px">${c.hits.length?c.hits.map(h=>`<div class="hit"><b>${esc(h.word)}</b>　<span class="chip">${esc(h.category)}</span>${h.note?`<div class="hint">${esc(h.note)}</div>`:''}<div>${esc(h.sentence)}</div></div>`).join('')
      :'<p>沒有命中禁用詞。</p>'}<p class="hint">${esc(c.disclaimer)}</p></div>`:''}</section>`;
}

function bindSettings(){
  const k=UI.sec.startsWith('t:')?UI.sec.slice(2):null;
  const gf=$('#gform');
  if(gf)gf.onsubmit=async e=>{
    e.preventDefault();
    const values={};
    UI.config.settings.filter(s=>gf.elements[s.key]).forEach(s=>{const v=gf.elements[s.key].value.trim();if(v!==s.value)values[s.key]=v});
    if(!Object.keys(values).length){toast('沒有變更');return}
    const b=gf.querySelector('button[type=submit]');b.disabled=true;
    const r=await api('saveSettings',{values});b.disabled=false;
    if(!r.ok){toast(errText(r));return}
    UI.config.settings.forEach(s=>{if(s.key in values)s.value=values[s.key]});
    toast('已儲存');await loadConfig();renderSettings();
  };
  const cf=$('#cform');
  if(cf)cf.onsubmit=async e=>{
    e.preventDefault();const text=cf.elements.text.value;if(!text.trim())return;
    const r=await api('checkText',{text});if(!r.ok){toast(errText(r));return}
    UI.check={text,hits:r.hits,disclaimer:r.disclaimer};renderSettings();
  };
  if(!k)return;
  const tq=$('#tq');
  if(tq)tq.oninput=()=>{UI.q=tq.value;const pos=tq.selectionStart;renderSettings();const n=$('#tq');n.focus();n.setSelectionRange(pos,pos)};
  $('#add').onclick=()=>{UI.adding=true;UI.openId=null;renderSettings();document.querySelector('.rowform [name]')?.focus()};
  document.querySelectorAll('details.item[data-id]>summary').forEach(s=>s.onclick=e=>{
    e.preventDefault();const id=s.parentElement.dataset.id;UI.openId=UI.openId===id?null:id;UI.adding=false;renderSettings();
  });
  document.querySelectorAll('.rowform').forEach(f=>{
    const id=f.dataset.id;
    f.querySelector('[data-cancel]').onclick=()=>{UI.openId=null;UI.adding=false;renderSettings()};
    const del=f.querySelector('[data-del]');
    if(del)del.onclick=async()=>{
      if(!confirm('確定刪除這一筆？刪除後無法復原（停用則可以保留紀錄）。'))return;
      del.disabled=true;const r=await api('deleteRow',{table:k,id});
      if(!r.ok){del.disabled=false;toast(errText(r));return}
      UI.config.tables[k].rows=UI.config.tables[k].rows.filter(x=>x.id!==id);UI.openId=null;toast('已刪除');await loadConfig();renderSettings();
    };
    f.onsubmit=async e=>{
      e.preventDefault();
      const row={};if(id)row.id=id;
      UI.config.tables[k].cols.forEach(c=>{if(f.elements[c.key])row[c.key]=f.elements[c.key].value});
      const b=f.querySelector('button[type=submit]');b.disabled=true;
      const r=await api('saveRow',{table:k,row});
      if(!r.ok){b.disabled=false;toast(errText(r));return}
      b.disabled=false;
      const rows=UI.config.tables[k].rows;const i=rows.findIndex(x=>x.id===r.row.id);
      if(i>=0)rows[i]=r.row;else rows.push(r.row);
      UI.openId=null;UI.adding=false;toast(id?'已儲存':'已新增 '+r.row.id);await loadConfig();renderSettings();
    };
  });
}

start();
</script>
</body>
</html>
